plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional: the death compass goes in Map Plus Plus's compass slot when that mod is present.
	// Compile-only and never bundled, and guarded at runtime, so this mod keeps working for a
	// vanilla client with neither installed. Pandorical comes along because the slot is registered
	// through it: wherever Map Plus Plus is, Pandorical is too.
	//
	// Resolved by the version each declares rather than a version written down here, because
	// Gradle never clears build/libs and a name pinned by hand keeps compiling green against a jar
	// an old build left behind.
	def optional = { String name, String jarPrefix ->
		def props = file("../${name}/gradle.properties")
		if (!props.exists()) return null
		def version = new Properties().with {
			props.withInputStream { load(it) }
			getProperty("mod_version")?.trim()
		}
		def jar = file("../${name}/build/libs/${jarPrefix}-${version}.jar")
		return jar.exists() ? jar : null
	}

	def mapJar = optional("map-plus-plus", "map-plus-plus")
	def pandoricalJar = optional("pandorical", "pandorical")
	def chestUtilsJar = optional("chest-utils", "chest-utils")
	if (mapJar != null && pandoricalJar != null && chestUtilsJar != null) {
		compileOnly files(mapJar, pandoricalJar, chestUtilsJar)
	} else {
		// Said plainly: the integration below imports these outright, so a missing jar surfaces as
		// "package justfatlard.map_plus_plus does not exist" rather than as anything useful.
		throw new GradleException("dead-heads compiles against map-plus-plus, pandorical and" +
			" chest-utils. Run `mc-build` for each of them first.")
	}
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
	.replaceFirst(/-snapshot-/, '-alpha.')
	.replaceFirst(/-pre-/, '-pre.')
	.replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "loaderVersion", project.loader_version
	inputs.property "fabricApiVersion", fabricApiFloor
	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraftDependency": minecraftDependency,
		       "loaderVersion": project.loader_version,
		       "fabricApiVersion": fabricApiFloor
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
